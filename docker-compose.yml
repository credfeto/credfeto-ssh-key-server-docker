---
services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: ssh-key-server
      # Watchtower expects this interval in seconds.
      WATCHTOWER_POLL_INTERVAL: 60

  ssh-key-server:
    image: ${SSH_KEY_SERVER_IMAGE:-ghcr.io/credfeto/ssh-key-server:latest}
    container_name: ssh-key-server
    hostname: ssh-key-server
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
      - "${HTTPS_PORT:-8081}:8081"
      - "${HTTPS_PORT:-8081}:8081/udp"
    environment:
      Challenge__HmacSecret: ${CHALLENGE_HMAC_SECRET:?CHALLENGE_HMAC_SECRET must be set in .env - run ./install}
    volumes:
      - ./certs/server.pfx:/usr/src/app/server.pfx:ro
      - keyserver-data:/var/lib/ssh-key-server/keys

  git-backup:
    build: ./git-backup
    container_name: git-backup
    restart: unless-stopped
    user: "1654:1654"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp
    environment:
      BACKUP_REPO: ${BACKUP_REPO:?BACKUP_REPO must be set in .env - run ./install}
      BACKUP_GIT_NAME: ${BACKUP_GIT_NAME:-ssh-key-server-backup}
      BACKUP_GIT_EMAIL: ${BACKUP_GIT_EMAIL:-ssh-key-server-backup@users.noreply.github.com}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-300}
    volumes:
      - keyserver-data:/data:ro
      - ${BACKUP_SSH_KEY:?BACKUP_SSH_KEY must be set in .env - run ./install}:/run/secrets/backup_ssh_key:ro
      - git-backup-work:/work

volumes:
  keyserver-data:
    external: true
    name: keyserver-data
  git-backup-work:
